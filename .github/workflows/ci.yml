name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check the coverage threshold
        run: |
          min=60
          total=$(awk -F: '
            /^LF:/ { lf += $2 }
            /^LH:/ { lh += $2 }
            END { printf "%.1f", 100 * lh / lf }
          ' coverage/lcov.info)
          echo "Line coverage: ${total}% (minimum ${min}%)"
          if awk -v c="$total" -v m="$min" 'BEGIN { exit !(c >= m) }'; then
            echo "Coverage gate passed"
          else
            echo "Coverage is below ${min}%"
            exit 1
          fi

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14